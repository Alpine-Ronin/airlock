name: Idea
description: Something Airlock could do, or a client it could connect.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to do, and what got in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would solve it
    validations:
      required: false
