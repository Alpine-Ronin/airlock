name: binaries

# One executable per platform: a static PHP 8.5 runtime (static-php-cli's micro) with Airlock's PHAR appended.
# Built and smoke-tested on each platform whenever what goes into them changes; published on a version tag.
on:
    push:
        tags: ['v*']
    pull_request:
        paths:
            - '.github/workflows/binaries.yaml'
            - '.github/scripts/**'
            - 'bin/build-phar.php'
            - 'composer.lock'
            - 'config/**'
    workflow_dispatch:

permissions:
    contents: read

env:
    PHP_VERSION: '8.5'
    # static-php-cli builds the runtime: a pinned release, so that a new one cannot break a release build unannounced.
    SPC_VERSION: '2.8.5'
    PHP_EXTENSIONS: 'ctype,curl,dom,fileinfo,filter,iconv,mbstring,openssl,pcntl,phar,posix,session,tokenizer,xml,zlib'

jobs:
    phar:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v5

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ env.PHP_VERSION }}
                  coverage: none
                  ini-values: phar.readonly=0

            - run: composer install --no-dev --classmap-authoritative --no-scripts --no-interaction --no-progress

            - run: composer dump-env prod

            - run: php bin/console cache:warmup

            - run: php bin/build-phar.php build/airlock.phar

            - uses: actions/upload-artifact@v4
              with:
                  name: airlock.phar
                  path: build/airlock.phar

    binary:
        needs: phar
        strategy:
            fail-fast: false
            matrix:
                # spc-sha256: static-php-cli's archive for the target at SPC_VERSION, as its release publishes it. A
                # release can still be changed after it is published, and spc runs with this job's token.
                include:
                    - { target: linux-x86_64, os: ubuntu-24.04, spc-sha256: 523ba4279c54c7a377156c0dd3a36adf92ee64b01e9a7f5e9e2ec084b8e458e5 }
                    - { target: linux-aarch64, os: ubuntu-24.04-arm, spc-sha256: 675a3840dcdc4ed041fe20eaa54310ce019a9984c1c03951df9ec66df5795213 }
                    - { target: macos-aarch64, os: macos-15, spc-sha256: acf2f25d56d0cbf8e65aa82e5054fef555f7be7c5c38046c6e0819f266d83225 }
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v5

            - uses: actions/download-artifact@v4
              with:
                  name: airlock.phar
                  path: build

            - name: Name the runtime by its PHP version and extensions
              id: runtime-key
              shell: bash
              run: echo "key=micro-${{ matrix.target }}-php${{ env.PHP_VERSION }}-spc${{ env.SPC_VERSION }}-$(printf '%s' "$PHP_EXTENSIONS" | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"

            - name: Restore the static PHP runtime
              id: runtime
              uses: actions/cache@v4
              with:
                  path: buildroot/bin/micro.sfx
                  key: ${{ steps.runtime-key.outputs.key }}

            - name: Build the static PHP runtime
              if: steps.runtime.outputs.cache-hit != 'true'
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  # musl's own release archive, as Debian mirrors it unchanged: musl.libc.org, where spc doctor fetches
                  # it on Linux, is often unreachable. Same SHA-256 as Debian's source record and Alpine's APKBUILD.
                  MUSL_ARCHIVE_URL: https://deb.debian.org/debian/pool/main/m/musl/musl_1.2.5.orig.tar.gz
                  MUSL_ARCHIVE_SHA256: a9a118bbe84d8764da0ea0d28b3ab3fae8477fc7e4085d90102b8596fc7c75e4
              run: |
                  curl -fsSL -o spc.tgz "https://github.com/crazywhalecc/static-php-cli/releases/download/${{ env.SPC_VERSION }}/spc-${{ matrix.target }}.tar.gz"
                  echo "${{ matrix.spc-sha256 }}  spc.tgz" | shasum -a 256 -c -
                  tar -xzf spc.tgz
                  if [ "$RUNNER_OS" = Linux ]; then
                      curl -fsSL --connect-timeout 20 --max-time 120 --retry 3 --retry-all-errors -o "$RUNNER_TEMP/musl-1.2.5.tar.gz" "$MUSL_ARCHIVE_URL"
                      echo "$MUSL_ARCHIVE_SHA256  $RUNNER_TEMP/musl-1.2.5.tar.gz" | sha256sum -c -
                      ./spc download musl-1.2.5 --custom-url="musl-1.2.5:file://$RUNNER_TEMP/musl-1.2.5.tar.gz"
                  fi
                  ./spc doctor --auto-fix
                  ./spc download --with-php=${{ env.PHP_VERSION }} --for-extensions="${{ env.PHP_EXTENSIONS }}" --prefer-pre-built
                  ./spc build "${{ env.PHP_EXTENSIONS }}" --build-micro

            - name: Append the PHAR to the runtime
              run: |
                  cat buildroot/bin/micro.sfx build/airlock.phar > "airlock-${{ matrix.target }}"
                  chmod +x "airlock-${{ matrix.target }}"

            # Ubuntu 24.04's AppArmor forbids unprivileged user namespaces, which bubblewrap needs.
            - name: Install bubblewrap
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y bubblewrap
                  sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

            - name: Run one command through the binary, as a client would
              run: cd "$(mktemp -d)" && python3 "$GITHUB_WORKSPACE/.github/scripts/smoke.py" -- "$GITHUB_WORKSPACE/airlock-${{ matrix.target }}" mcp:server

            # The environment wins over the configuration packed in the binary: an API set there is called (and refused).
            - name: Read the model API from the environment
              env:
                  AIRLOCK_AI_BASE_URL: http://127.0.0.1:9
                  AIRLOCK_AI_API_KEY: smoke
                  AIRLOCK_OUTPUT_CHECK_MODEL: smoke/model
              run: cd "$(mktemp -d)" && python3 "$GITHUB_WORKSPACE/.github/scripts/smoke.py" --expect "the model could not be reached" -- "$GITHUB_WORKSPACE/airlock-${{ matrix.target }}" mcp:server

            # airlock connect writes the command a client will run: the binary itself, not PHP.
            - name: Point a client at the binary
              run: |
                  export HOME="$(mktemp -d)"
                  binary="$GITHUB_WORKSPACE/airlock-${{ matrix.target }}"
                  cd "$(mktemp -d)" && "$binary" connect codex --no-interaction
                  grep -Fx "command = \"$binary\"" "$HOME/.codex/config.toml"

            - uses: actions/upload-artifact@v4
              with:
                  name: airlock-${{ matrix.target }}
                  path: airlock-${{ matrix.target }}

    release:
        if: startsWith(github.ref, 'refs/tags/v')
        needs: binary
        runs-on: ubuntu-24.04
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@v4
              with:
                  pattern: airlock-*
                  merge-multiple: true

            - run: sha256sum airlock-* > SHA256SUMS

            - name: Publish the release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release create "$GITHUB_REF_NAME" airlock-* SHA256SUMS --repo "$GITHUB_REPOSITORY" --generate-notes
