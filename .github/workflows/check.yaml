name: check

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
              with:
                  persist-credentials: false

            - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: '8.5'
                  coverage: none

            # Ubuntu 24.04's AppArmor forbids unprivileged user namespaces, which bubblewrap needs.
            - name: Install bubblewrap
              run: |
                  sudo apt-get update
                  sudo apt-get install -y bubblewrap
                  sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

            - run: composer validate --strict

            - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

            - run: composer audit

            - run: composer check

            - name: Run one command through the server, as a client would
              run: cd "$(mktemp -d)" && python3 "$GITHUB_WORKSPACE/.github/scripts/smoke.py" -- php "$GITHUB_WORKSPACE/bin/console" mcp:server

    docker:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
              with:
                  persist-credentials: false

            - name: Allow bubblewrap's user namespaces
              run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

            - run: docker build -t airlock .

            - name: Run one command through the image, as the README starts it
              run: |
                  mkdir -p "$HOME/.config/airlock"
                  cd "$(mktemp -d)"
                  python3 "$GITHUB_WORKSPACE/.github/scripts/smoke.py" -- docker run --rm -i -u "$(id -u):$(id -g)" \
                    --security-opt seccomp=unconfined --security-opt apparmor=unconfined --security-opt systempaths=unconfined \
                    -e AIRLOCK_AI_BASE_URL -e AIRLOCK_AI_API_KEY -e AIRLOCK_OUTPUT_CHECK_MODEL -e AIRLOCK_RISK_MODEL \
                    -e XDG_CONFIG_HOME=/airlock-config \
                    -v "$HOME/.config/airlock:/airlock-config/airlock" -v "$PWD:$PWD" -w "$PWD" airlock
